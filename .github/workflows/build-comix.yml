name: Build Comix Fast
on:
  workflow_dispatch:  # Manual trigger button
    inputs:
      reason:
        description: 'Build reason'
        required: false
        default: 'Building Comix Fast APK'

jobs:
  build:
    name: Build Comix Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Comix only
        run: ./gradlew :src:en:comix:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Comix-Fast-APK
          path: src/en/comix/build/outputs/apk/debug/*.apk
